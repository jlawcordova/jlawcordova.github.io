<!-- The card as it shows on the site, here in place rather than fixed to the corner. On the site it's hidden until the achievements list scrolls into view, rises in, and closes itself after 5 seconds. -->
<div class="achievement-toast__card" data-theme="light" style="max-width:420px">
  <span class="achievement__icon" data-icon="rocket" data-frame="make"><svg class="achievement__frame pixel-art" viewBox="20 0 20 20" width="60" height="60" aria-hidden="true" focusable="false"><use href="#achievement-frames"/></svg><svg class="achievement__glyph pixel-art" viewBox="64 0 16 16" width="48" height="48" aria-hidden="true" focusable="false"><use href="#achievement-icons"/></svg></span>
  <p class="achievement-toast__text">
    <span class="achievement-toast__label">Achievement unlocked!</span>
    <span class="achievement-toast__name">Night Owl</span>
    <span class="achievement-toast__line">Nightly loads finish before 06:00 · Sep 2026</span>
  </p>
  <button class="achievement-toast__close" type="button" aria-label="Close"><svg class="pixel-art" viewBox="0 0 6 6" width="15" height="15" aria-hidden="true" focusable="false"><path fill="currentColor" d="M0 0h1v1h-1zM5 0h1v1h-1zM1 1h1v1h-1zM4 1h1v1h-1zM2 2h2v2h-2zM1 4h1v1h-1zM4 4h1v1h-1zM0 5h1v1h-1zM5 5h1v1h-1z"/></svg></button>
</div>
