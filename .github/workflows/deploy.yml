name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build (but don't deploy) pull requests so a broken build is caught before merging.
  # Also build pull requests into feature branches (feat/**), whose slices
  # merge there before one final pull request takes them to main.
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:
  # Sent by the jlawcordova-mcp Worker after an accomplishment is added or deleted.
  repository_dispatch:
    types: [atproto-updated]
  # Daily rebuild catches any accomplishment change whose dispatch was missed.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # npm test on every pull request and push, so a failing test blocks the
      # merge. The browser checks (npm run e2e) need Playwright and aren't run here.
      # withastro/action installs again below; that's intended, and quick with the cache.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      # Never fails the build: on any error it writes an "unavailable" file.
      - name: Fetch accomplishments from AT Protocol
        run: node scripts/fetch-accomplishments.mjs
      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
